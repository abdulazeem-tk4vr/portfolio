[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/new-grad.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/AbdulAzeemShaik_CV.pdf"
  to = "/AbdulAzeemShaik_Resume.pdf"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
