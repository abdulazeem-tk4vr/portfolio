<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <title>Agent consensus workflow</title>
  <desc>A task is reviewed by three agents. Their responses go to a quorum check before a decision.</desc>
  <rect width="800" height="450" fill="#eef4ff"/>
  <g fill="none" stroke="#c5d5ef" stroke-width="1"><path d="M0 90H800M0 180H800M0 270H800M0 360H800M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450"/></g>
  <g fill="none" stroke="#4076df" stroke-width="2"><path d="M167 225H212V115H258M212 225H258M212 225V335H258M398 115H445V225H480M398 225H480M398 335H445V225M620 225H654"/></g>
  <g fill="#fff" stroke="#c1d1eb"><rect x="42" y="193" width="125" height="64" rx="14"/><rect x="258" y="83" width="140" height="64" rx="14"/><rect x="258" y="193" width="140" height="64" rx="14"/><rect x="258" y="303" width="140" height="64" rx="14"/><rect x="480" y="180" width="140" height="90" rx="14"/></g>
  <rect x="654" y="193" width="120" height="64" rx="14" fill="#2459be"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="19" fill="#152b4b"><text x="105" y="232">Task</text><text x="328" y="122">Agent 1</text><text x="328" y="232">Agent 2</text><text x="328" y="342">Agent 3</text><text x="550" y="220">Quorum</text><text x="550" y="246" font-size="15" fill="#536b8d">Agreement check</text><text x="714" y="232" fill="#fff">Decision</text></g>
  <g fill="#4076df"><circle cx="212" cy="225" r="5"/><circle cx="445" cy="225" r="5"/></g>
  <text x="42" y="44" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#536b8d">INDEPENDENT REVIEWS · SHARED DECISION</text>
</svg>
